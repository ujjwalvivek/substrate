name: Publish package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js for npm
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # This repository intentionally does not commit a package-lock.json.
      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Build package
        run: npm run build:engine

      - name: Check package contents
        run: npm pack --dry-run --workspace @ujjwalvivek/substrate

      - name: Check whether this npm version exists
        id: npm_version
        shell: bash
        run: |
          package_name="$(node -p "require('./packages/substrate/package.json').name")"
          package_version="$(node -p "require('./packages/substrate/package.json').version")"
          error_file="$(mktemp)"

          if npm view "${package_name}@${package_version}" version \
            --registry=https://registry.npmjs.org/ > /dev/null 2>"${error_file}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} already exists on npm; skipping npm publish."
          else
            status=$?
            if grep -q "E404" "${error_file}"; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "${package_name}@${package_version} is not on npm; it will be published."
            else
              cat "${error_file}"
              exit "${status}"
            fi
          fi

      - name: Publish to npm with trusted publishing
        if: steps.npm_version.outputs.exists != 'true'
        # npm authenticates with this job's configured OIDC trusted publisher.
        run: npm publish --workspace @ujjwalvivek/substrate --access public

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com/
          scope: "@ujjwalvivek"

      - name: Publish to GitHub Packages
        run: npm publish --workspace @ujjwalvivek/substrate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
